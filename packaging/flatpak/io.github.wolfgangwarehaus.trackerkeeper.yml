# Flatpak manifest for tracker keeper. GENERATED by `trackerkeeper bake` from
# [tool.trackerkeeper.metadata] — edit the template, never this file.
#
# A self-distributed .flatpak bundle (release.yml's build-linux-flatpak),
# NOT a Flathub submission. Users install it with
#   flatpak install ./trackerkeeper-X.Y.Z.flatpak
# It's the natural channel for Plasma Mobile / Phosh: the KDE runtime brings
# Qt Quick, so the phone interface works out of the box.
#
# Ported from jellytoast's manifest, with its two hard-won rules:
#   * PySide6 comes from io.qt.PySide.BaseApp (built against the runtime's
#     Qt) and must NOT be replaced by the PyPI wheel — a second, version-skewed
#     libQt6 under the same SONAME broke KWin blur there. trackerkeeper's only
#     dependency IS PySide6, so the app installs with --no-deps.
#   * The build tree has no .git, so setuptools-scm can't read the tag: the
#     version is handed in (release.yml renders this with --release-version).
app-id: io.github.wolfgangwarehaus.trackerkeeper
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: trackerkeeper

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network                                 # every checker is a web request
  - --device=dri                                    # GPU for Qt RHI
  - --talk-name=org.freedesktop.Notifications       # "N new updates" toasts
  - --talk-name=org.kde.StatusNotifierWatcher       # the tray icon (desktop)

build-options:
  build-args:
    - --share=network        # pip fetches setuptools + setuptools-scm to build
  env:
    SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'

modules:
  - name: trackerkeeper
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-cache-dir --no-deps .
      - install -Dm755 launcher.sh /app/bin/trackerkeeper
      - install -Dm644 packaging/io.github.wolfgangwarehaus.trackerkeeper.desktop
        /app/share/applications/io.github.wolfgangwarehaus.trackerkeeper.desktop
      - install -Dm644 packaging/io.github.wolfgangwarehaus.trackerkeeper.metainfo.xml
        /app/share/metainfo/io.github.wolfgangwarehaus.trackerkeeper.metainfo.xml
      - install -Dm644 trackerkeeper/assets/trackerkeeper.svg
        /app/share/icons/hicolor/scalable/apps/io.github.wolfgangwarehaus.trackerkeeper.svg
    sources:
      - type: dir
        path: ../..
        dest: .
        skip:
          - .git
          - .venv
          - dist
          - build
          - .flatpak-builder
      - type: script
        dest-filename: launcher.sh
        commands:
          # Native Wayland with an xcb fallback; without it Qt tries xcb first
          # inside the sandbox.
          - export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          - exec python3 -m trackerkeeper "$@"
